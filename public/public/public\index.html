<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ഗ്രൂപ്പ് ഗാർഡ് ബോട്ട്</title>
  <style>
    body { font-family: sans-serif; background: #0b141a; color: #e9edef; margin: 0; padding: 20px; }
    .card { max-width: 420px; margin: 40px auto; background: #202c33; padding: 24px; border-radius: 14px; }
    h1 { font-size: 22px; margin-top: 0; }
    input, button { width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; border: none; box-sizing: border-box; margin-top: 12px; }
    button { background: #00a884; color: white; font-weight: bold; }
    #code { font-size: 32px; letter-spacing: 6px; text-align: center; margin-top: 20px; color: #00a884; }
    #msg { margin-top: 12px; color: #ffb4a9; }
    ol { padding-left: 20px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ഗ്രൂപ്പ് ഗാർഡ് ബോട്ട്</h1>
    <p>നിങ്ങളുടെ വാട്സപ്പ് നമ്പർ രാജ്യ കോഡ് സഹിതം കൊടുക്കുക.</p>
    <input id="number" type="tel" placeholder="919876543210">
    <button onclick="pair()">പെയറിംഗ് കോഡ് എടുക്കുക</button>
    <div id="code"></div>
    <div id="msg"></div>
    <ol>
      <li>വാട്സപ്പ് തുറന്ന് Linked Devices എടുക്കുക.</li>
      <li>Link a device, പിന്നെ Link with phone number instead.</li>
      <li>മുകളിലെ കോഡ് അടിക്കുക.</li>
      <li>ബോട്ടിനെ ഗ്രൂപ്പിൽ ചേർത്ത് അഡ്മിൻ ആക്കുക.</li>
    </ol>
  </div>
  <script>
    async function pair() {
      const codeBox = document.getElementById('code');
      const msg = document.getElementById('msg');
      codeBox.textContent = '';
      msg.textContent = 'കോഡ് ഉണ്ടാക്കുന്നു...';
      try {
        const r = await fetch('/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: document.getElementById('number').value })
        });
        const d = await r.json();
        if (d.code) { codeBox.textContent = d.code; msg.textContent = ''; }
        else { msg.textContent = d.error || 'എന്തോ പിശക് പറ്റി'; }
      } catch (e) {
        msg.textContent = 'സെർവറുമായി ബന്ധപ്പെടാൻ പറ്റിയില്ല.';
      }
    }
  </script>
</body>
</html>
